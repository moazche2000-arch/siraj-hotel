name: Publish Siraj Hotel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: siraj-hotel-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-web
      - name: Install Godot and web template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          curl -fL --retry 3 "$release/$editor.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -p "$RUNNER_TEMP/godot.zip" "$editor" > "$HOME/godot"
          chmod +x "$HOME/godot"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -j "$RUNNER_TEMP/templates.tpz" 'templates/web_nothreads_release.zip' -d "$template_dir"
      - name: Import and export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$HOME/godot" --headless --editor --import --quit
          "$HOME/godot" --headless --export-release Web build/index.html
          test -s build/index.html
          test -s build/index.wasm
          test -s build/index.pck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  publish:
    runs-on: ubuntu-latest
    needs: export
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
