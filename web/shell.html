<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#0d151e">
	<title>فندق السراج</title>
	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0d151e; }
		body { color: #f3ead9; font-family: system-ui, sans-serif; }
		canvas { display: block; outline: none; touch-action: none; }
		#status { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; background: #0d151e; }
		#status[hidden] { display: none; }
		h1 { color: #edc583; margin: 0 0 .45em; font-size: clamp(2rem, 6vw, 3.75rem); }
		p { max-width: 32rem; margin: 0 auto 1.4em; color: #b8c8cd; line-height: 1.7; }
		progress { width: min(64vw, 18rem); height: .6rem; margin: auto; accent-color: #91dac7; }
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="0" aria-label="لعبة فندق السراج"></canvas>
	<main id="status" role="status">
		<h1>فندق السِّراج</h1>
		<p id="loading-message">جاري تحميل اللعبة…</p>
		<progress id="loading-progress" aria-label="تقدم التحميل"></progress>
	</main>
	<script src="$GODOT_URL"></script>
	<script>
		const config = $GODOT_CONFIG;
		const engine = new Engine(config);
		const status = document.getElementById('status');
		const message = document.getElementById('loading-message');
		const progress = document.getElementById('loading-progress');
		const missing = Engine.getMissingFeatures({ threads: false });
		if (missing.length) {
			message.textContent = 'تعذّر تشغيل اللعبة. افتح الرابط في متصفح يدعم WebGL 2.';
			progress.hidden = true;
		} else {
			engine.startGame({
				onProgress(current, total) {
					if (total > 0) {
						progress.max = total;
						progress.value = current;
					}
				}
			}).then(() => {
				status.hidden = true;
			}).catch((error) => {
				console.error(error);
				message.textContent = 'تعذّر تحميل اللعبة. جرّب تحديث الصفحة.';
				progress.hidden = true;
			});
		}
	</script>
</body>
</html>
